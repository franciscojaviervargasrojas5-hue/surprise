<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para alguien especial ❤️</title>
    <!-- Aquí conectamos los estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>✨ Hay momentos que no se olvidan ✨</h1>
        <p>Gracias por cada risa, cada momento y por hacer todo más bonito. ¿Te ha gustado esta pequeña sorpresa?</p>
        
        <div class="buttons">
            <button id="btnSi" onclick="aceptar()">¡Sí, mucho! ❤️</button>
            <button id="btnNo" onmouseover="moverNo()" onclick="moverNo()">No 😢</button>
        </div>
    </div>

    <div class="container hidden" id="successContainer">
        <h1>¡Sabía que dirías que sí! 🥰</h1>
        <p id="mensajeFinal">Te quiero muchísimo. Este es solo un detalle para recordarte lo especial que eres para mí.</p>
    </div>

    <!-- Aquí conectamos el código de JavaScript -->
    <script src="script.js"></script>
</body>
</html>
